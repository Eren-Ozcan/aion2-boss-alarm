[package]
name = "bellmeter"
version = "0.2.0"
description = "Sound alarms for AION 2 field and abyss boss respawns"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]
members = ["dps-core"]

[lib]
name = "bellmeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libloading = "0.9.0"
lz4_flex = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dps-core = { path = "dps-core" }
tauri = { version = "2.12.2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

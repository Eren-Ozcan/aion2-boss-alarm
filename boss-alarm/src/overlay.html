<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPS overlay</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="meter" id="meter">
    <div class="rule" aria-hidden="true"></div>

    <div class="header" data-tauri-drag-region>
      <i class="diamond" aria-hidden="true"></i>
      <div class="titles" data-tauri-drag-region>
        <div id="bossName" class="boss-name" data-tauri-drag-region></div>
        <div id="bossSub" class="boss-sub" data-tauri-drag-region></div>
      </div>
      <div class="btns">
        <button id="windowBtn" class="hbtn" aria-label="Open settings window" title="Alarms, history, settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>
        </button>
        <button id="muteBtn" class="hbtn" aria-label="Mute alarms" title="Mute alarms" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/><path id="muteSlash" d="M3 3l18 18" style="display:none"/></svg>
        </button>
        <button id="lockBtn" class="hbtn" aria-label="Lock overlay" title="Lock overlay (clicks pass through)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
        <button id="timersBtn" class="hbtn" aria-label="Boss timers" title="Boss timers" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6"/></svg>
        </button>
        <button id="resetBtn" class="hbtn" aria-label="Reset" title="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
        </button>
        <button id="settingsBtn" class="hbtn" aria-label="Settings" title="Settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
        <button id="closeBtn" class="hbtn close" aria-label="Close overlay" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <div id="settings" class="settings" hidden>
      <label class="range"><span id="lblOpacity"></span>
        <input id="opacity" type="range" min="0" max="100" value="72">
      </label>
      <label class="range"><span id="lblRows"></span>
        <input id="rowCount" type="range" min="1" max="12" value="6">
      </label>
      <label class="range"><span id="lblScale"></span>
        <input id="textScale" type="range" min="80" max="170" step="5" value="100">
      </label>
      <label class="check"><span id="lblPin"></span>
        <input id="pinMe" type="checkbox">
      </label>
      <label class="check"><span id="lblPing"></span>
        <input id="showPing" type="checkbox" checked>
      </label>
      <label class="check"><span id="lblTtk"></span>
        <input id="showTtk" type="checkbox" checked>
      </label>
      <label class="check"><span id="lblTotal"></span>
        <input id="showTotal" type="checkbox">
      </label>
      <label class="check"><span id="lblAutoHide"></span>
        <input id="autoHide" type="checkbox">
      </label>
      <label class="check"><span id="lblReset"></span>
        <input id="resetEvery" type="checkbox">
      </label>
      <label class="check"><span id="lblPartial"></span>
        <input id="showPartial" type="checkbox">
      </label>
      <label class="check"><span id="lblFit"></span>
        <input id="autoFit" type="checkbox" checked>
      </label>
      <div class="btnrow"><button id="resetPos" class="sbtn" type="button"></button></div>
    </div>

    <div id="timers" class="timers" hidden>
      <div id="tHead" class="t-head">
        <span id="tTitle" class="t-title"></span>
        <span id="tSync" class="t-sync"></span>
        <span class="t-next"><span id="tNextName" class="n"></span><span id="tNextTime" class="t"></span></span>
      </div>
      <div id="liveRow" class="live-row" hidden></div>
    </div>
    <div id="alerts" class="alerts" hidden></div>
    <div id="nextList" class="next-list" hidden></div>

    <div id="hp" class="hp" hidden>
      <div id="hpFill" class="hp-fill"></div>
      <div class="hp-ticks" aria-hidden="true"></div>
      <div class="hp-text"><span id="hpPct"></span><span id="hpAmt"></span></div>
    </div>

    <div id="list" class="list"></div>
    <div id="empty" class="empty"></div>
    <div id="card" class="card" hidden></div>
    <div id="lockBadge" class="lock-badge" hidden></div>

    <div class="footer" data-tauri-drag-region>
      <span id="dot" class="dot"></span>
      <span id="time" class="time"></span>
      <span id="status" class="status" data-tauri-drag-region></span>
      <span id="total" class="total-line"></span>
      <span id="ttk" class="ttk"></span>
      <span id="ping" class="ping" title="Ping"></span>
      <button id="modeBtn" class="fbtn gold" type="button" aria-label="Target mode"></button>
      <button id="metricBtn" class="fbtn" type="button" aria-label="Figures shown"></button>
      <button id="sortBtn" class="fbtn icon" type="button" aria-label="Sort order" title="Sort order">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="sortIcon" d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
    </div>
    <div id="resizeHandle" class="resize" aria-hidden="true"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
